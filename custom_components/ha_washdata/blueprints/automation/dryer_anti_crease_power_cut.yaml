blueprint:
  name: "WashData: end a long dryer anti-crease phase"
  description: >-
    For dryers that keep tumbling in anti-crease for hours after the program.
    It runs when WashData sees the dryer still tumbling in short bursts the set
    number of minutes after the program finished, then switches the dryer's
    smart plug off in a low-power moment and, by default, back on. A new cycle
    starting in the meantime cancels it.


    Risk: this switches a relay while the dryer is plugged in. Use it only with
    a plug rated for your dryer and at your own risk. WashData never switches
    the plug itself; this automation does.


    Needs WashData 0.5.9 or newer.
  domain: automation
  author: WashData
  source_url: https://github.com/3dg1luk43/ha_washdata/blob/main/custom_components/ha_washdata/blueprints/automation/dryer_anti_crease_power_cut.yaml
  input:
    washdata_device:
      name: Dryer
      description: The WashData device of the dryer.
      selector:
        device:
          filter:
            - integration: ha_washdata
    wait_minutes:
      name: Wait first
      description: >-
        Minutes after the program finishes. The power is cut at the first tumble
        after that; if the dryer has stopped tumbling, nothing happens.
      default: 20
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    low_power_w:
      name: Low-power threshold
      description: Cut only while the dryer draws less than this, between two tumbles. Gives up if that does not happen within 15 minutes.
      default: 10
      selector:
        number:
          min: 1
          max: 500
          unit_of_measurement: W
    off_seconds:
      name: Power-off time
      default: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
    turn_back_on:
      name: Turn the plug back on
      default: true
      selector:
        boolean: {}
    presence_entities:
      name: Only turn back on when one of these is home
      description: Leave empty to always turn the plug back on. If set and nobody is home, the plug stays off.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
    plug_switch:
      name: Plug switch
      description: Leave empty to use the switch on the same device as WashData's power sensor.
      default: ""
      selector:
        entity:
          filter:
            - domain: switch
    extra_actions:
      name: Then run
      description: Optional actions afterwards, for example a notification. The variable switched_back_on tells whether the plug was turned back on.
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

triggers:
  - trigger: ha_washdata.still_tumbling
    target:
      device_id: !input washdata_device
    options:
      minutes: !input wait_minutes

variables:
  low_power_w: !input low_power_w
  turn_back_on: !input turn_back_on
  presence_entities: !input presence_entities
  plug_switch_input: !input plug_switch
  power_entity: "{{ trigger.power_entity | default('', true) }}"
  plug_switch: "{{ plug_switch_input or trigger.switch_entity | default('', true) }}"

actions:
  - if:
      - condition: template
        value_template: "{{ not plug_switch }}"
    then:
      - action: system_log.write
        data:
          level: warning
          logger: blueprints.ha_washdata.dryer_anti_crease_power_cut
          message: >-
            {{ trigger.device_name | default('WashData', true) }}: no plug switch
            found on the power sensor's device. Set "Plug switch" in the automation.
      - stop: No plug switch found.
  - if:
      - condition: template
        value_template: "{{ not power_entity }}"
    then:
      - stop: Started without a WashData trigger.

  - alias: Wait for a low-power moment
    if:
      - condition: template
        value_template: >-
          {{ not (is_number(states(power_entity))
                  and states(power_entity) | float < low_power_w | float) }}
    then:
      - wait_for_trigger:
          - trigger: template
            id: low_power
            value_template: >-
              {{ is_number(states(power_entity))
                 and states(power_entity) | float < low_power_w | float }}
          - trigger: ha_washdata.cycle_started
            id: new_cycle
            target:
              device_id: !input washdata_device
        timeout: "00:15:00"
      - if:
          - condition: template
            value_template: "{{ wait.trigger is none }}"
        then:
          - stop: The power did not drop below the threshold within 15 minutes.
      - if:
          - condition: template
            value_template: "{{ wait.trigger.id == 'new_cycle' }}"
        then:
          - stop: A new cycle started.

  - action: switch.turn_off
    target:
      entity_id: "{{ plug_switch }}"
  - delay:
      seconds: !input off_seconds
  - variables:
      switched_back_on: >-
        {% set people = [presence_entities] if presence_entities is string else presence_entities %}
        {% set people = people | reject('eq', '') | list %}
        {{ turn_back_on and (people | length == 0
           or people | select('is_state', 'home') | list | length > 0) }}
  - if:
      - condition: template
        value_template: "{{ switched_back_on }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ plug_switch }}"
  - sequence: !input extra_actions
