name: Documentation Improvement
description: Report missing, incorrect, or unclear documentation
title: "[DOCS] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve our documentation!

        Want to fix it yourself? Open this issue first and tick the box below. Wait for the maintainer to add the `accepted` label before opening a PR - documentation PRs go through the same [contributor flow](https://github.com/3dg1luk43/ha_washdata/blob/main/CONTRIBUTING.md#contributor-pr-flow-non-translation-prs) as code (a PR opened without an accepted issue, or in parallel with a fresh one, is closed automatically). The only exception is translations, which are handled on [GitLocalize](https://gitlocalize.com/repo/10819).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before You Submit
      options:
        - label: I have checked that this documentation problem has not already been reported.
          required: true
        - label: I plan to submit a PR fixing this, and I understand I must wait for the `accepted` label first (leave unchecked if you just want to report it).
          required: false

  - type: input
    id: page
    attributes:
      label: Page / Section
      description: Which file or section of the documentation needs improvement?
      placeholder: "README.md → Configuration, or wiki page name"
    validations:
      required: true

  - type: textarea
    id: wrong
    attributes:
      label: What is Wrong or Missing?
      description: Describe the inaccuracy, gap, or confusing part. Quote the existing text if relevant.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Change
      description: If possible, propose the corrected or new text. Even a rough draft is helpful.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, links, or any other context that helps explain the problem.
    validations:
      required: false
