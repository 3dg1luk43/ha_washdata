name: Feature Request
description: Suggest an idea for WashData
title: "[FR] "
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!

        Please fill in only the sections that are relevant to your request. Fields marked as required must be completed - others can be skipped if they don't apply.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before You Submit
      options:
        - label: I have searched the [existing issues](https://github.com/3dg1luk43/ha_washdata/issues) and this feature has not already been requested.
          required: true
        - label: This request is specifically about WashData, not Home Assistant core or a third-party integration.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve, or what use case does it enable? Be specific.
      placeholder: "When my washing machine finishes, I have no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen. Be as concrete as possible.
    validations:
      required: true

  - type: dropdown
    id: device_type
    attributes:
      label: Related Device Type
      description: Is this feature specific to a particular appliance type, or general?
      options:
        - General / Not device-specific
        - Washing Machine
        - Dryer
        - Washer-Dryer Combo
        - Dishwasher
        - Pump / Sump Pump
        - Other (Advanced)
        - Threshold Device
        - Other
    validations:
      required: true

  - type: input
    id: device_brand_model
    attributes:
      label: Device Brand & Model (if device-specific)
      description: If this feature is only relevant for a specific device, provide the brand and model. Otherwise leave blank.
      placeholder: "e.g. Miele W1 WCG370 - or leave blank"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Data from your appliance

        A request about how your appliance's cycles are **detected, recognised or timed** (a program that is not recognised, an end that comes too early or too late, a phase that is not seen) can only be judged on your data: attach the **WashData export**. A request for something new (an option, a sensor, a notification text, a panel change) needs none: tick **No Device Data Needed**.

        <details>
        <summary><b>How to download the WashData export</b></summary>

        1. Open the **WashData** panel from the Home Assistant sidebar (as an administrator).
        2. Pick the appliance in the device bar at the top.
        3. Open the **Advanced** tab, then **Diagnostics** and **Export / Import**.
        4. Press **Quick export everything**. Your browser downloads a `.json` file (about 2 MB on a large install).
        5. Drag that file into the **Device Data** field below. GitHub takes `.json` files up to 25 MB; zip it if it is larger.

        The export holds this appliance's cycles, programs and WashData settings (entity ids included). It never contains passwords or tokens.

        </details>

  - type: checkboxes
    id: no_device_data
    attributes:
      label: No Device Data Needed
      description: >
        Tick this when the request does not depend on how your appliance's cycles are detected, recognised or timed. Leave it unticked
        otherwise: the request then needs the attached WashData export, and is flagged without it.
      options:
        - label: This request needs no data from my appliance (a new option, sensor, notification or panel change).
          required: false

  - type: textarea
    id: device_data
    attributes:
      label: Device Data
      description: Drag the WashData export (`.json`) here, and any log file (`.txt`) that shows the behaviour. Each file is attached as a link.
      placeholder: "Drop the WashData export here..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds you've tried, or alternative approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, links to related issues, or any other relevant context.
    validations:
      required: false

  - type: checkboxes
    id: pr_intention
    attributes:
      label: Contributing an Implementation
      description: >
        Want to build this yourself? Please agree the work with the maintainer **before** you write any code.


        **How it works:**

        1. Tick the box below to flag that you intend to submit a PR.

        2. Wait for the maintainer to review and add the `accepted` label. This is where scope and approach are agreed - the feature may already be planned, in progress, or intentionally out of scope.

        3. Only after the `accepted` label is added should you open a PR referencing this issue.


        **Do not** open a PR now, alongside this request. A PR opened in parallel with a not-yet-accepted issue skips the agree-first step: it is not reviewed and waits until the maintainer decides on the issue. Do not start significant work before the label is added either, so you never build something that cannot be merged.
      options:
        - label: I plan to submit a PR implementing this, and I understand I must wait for the `accepted` label before opening it (one opened now / in parallel is not reviewed until then)
          required: false
