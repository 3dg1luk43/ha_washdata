name: Bug Report
description: Create a report to help us improve WashData
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Please complete **all required fields**. For fields that don't apply to your specific bug (e.g. device details for a purely UI issue), enter `N/A` - but do not skip them without reason. Issues missing key information will be automatically flagged and may be closed without investigation.

        **Evidence is required**: attach the WashData export or paste logs in the **Evidence** section below (it explains how to get both), or tick **No Evidence Needed** there if your report genuinely needs none.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before You Submit
      description: Please confirm all of the following before opening this issue.
      options:
        - label: I have searched the [existing issues](https://github.com/3dg1luk43/ha_washdata/issues) and this is not a duplicate.
          required: true
        - label: I have attached the WashData export or a log file, or pasted log lines, in the Evidence section below - or ticked **No Evidence Needed** because no data could show this problem.
          required: true
        - label: I have filled in all applicable fields with real values and used `N/A` only where the field is genuinely irrelevant to my bug.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When I engage the flux capacitor, the washing machine assumes it's a coffee maker..."
    validations:
      required: true

  - type: dropdown
    id: device_type
    attributes:
      label: Device Type
      description: What type of appliance is this bug related to?
      options:
        - Washing Machine
        - Dryer
        - Washer-Dryer Combo
        - Dishwasher
        - Pump / Sump Pump
        - Other (Advanced)
        - Threshold Device
        - Other / Not applicable
    validations:
      required: true

  - type: input
    id: device_brand_model
    attributes:
      label: Device Brand & Model
      description: The brand and model number of your appliance (e.g. "Miele W1 WCG370"). Enter `N/A` if this bug is not related to a specific device.
      placeholder: "Brand Model Number or N/A"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: WashData Integration Version
      description: >
        What version of WashData are you running? (found in HACS or Settings → Integrations).
        Check the [Releases page](https://github.com/3dg1luk43/ha_washdata/releases) to see if a newer version is available - bugs already fixed in a later release won't be re-investigated.
      placeholder: "vX.Y.Z"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: What version of Home Assistant Core are you running? (found in Settings → About)
      placeholder: "2024.12.0"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Evidence

        Most bugs are about how a cycle was detected, recognised or timed, and those can only be investigated on **your data**. Attach the **WashData export** (best: it holds the power traces of your cycles) and/or paste **logs**. A report with neither is flagged automatically and closed if nothing is added. Expand the steps below.

        <details>
        <summary><b>How to download the WashData export</b> (recommended)</summary>

        1. Open the **WashData** panel from the Home Assistant sidebar (as an administrator).
        2. Pick the appliance in the device bar at the top.
        3. Open the **Advanced** tab, then **Diagnostics** and **Export / Import**.
        4. Press **Quick export everything**. Your browser downloads a `.json` file (about 2 MB on a large install).
        5. Drag that file into the **Export / Diagnostics / Log File** field below. GitHub takes `.json` files up to 25 MB; zip it if it is larger.

        The export holds this appliance's cycles, programs and WashData settings (entity ids included). It never contains passwords or tokens.

        </details>

        <details>
        <summary><b>How to download WashData's logs</b></summary>

        1. In the **WashData** panel, press the **Logs** button (the list icon at the top right, administrators only). It shows the last 500 WashData log lines since Home Assistant started.
        2. Press **Export**. Your browser downloads `washdata_logs_....txt`.
        3. Drag that file into the **Export / Diagnostics / Log File** field below, or paste the lines around the problem into **Logs / Error Evidence**.

        For full detail, turn on debug logging first (next section), reproduce the problem, then export.

        </details>

        <details>
        <summary><b>How to turn on debug logging</b></summary>

        Add this to `configuration.yaml` and restart Home Assistant:

        ```yaml
        logger:
          default: info
          logs:
            custom_components.ha_washdata: debug
        ```

        Reproduce the problem, then export the WashData logs as above, or use `Settings → System → Logs → Download full log` (filter by `ha_washdata` to find the lines).

        </details>

        <details>
        <summary><b>Home Assistant diagnostics instead of the export</b></summary>

        `Settings → Devices & services → WashData → your appliance → ⋮ → Download diagnostics`. Attach the file as it is, never paste it inline. The WashData export is still better: diagnostics hold fewer cycles.

        </details>

  - type: checkboxes
    id: no_evidence
    attributes:
      label: No Evidence Needed
      description: >
        Tick this only when no export or log could show the problem. Leave it unticked otherwise: the report then needs an attached file
        (export, diagnostics or log file) or pasted log lines, and is flagged without them.
      options:
        - label: This report needs no export or logs (for example a typo, a wrong translation, or a layout problem in the panel).
          required: false

  - type: textarea
    id: evidence_files
    attributes:
      label: Export / Diagnostics / Log File
      description: Drag the WashData export (`.json`), the diagnostics file or a log file (`.txt`) here. Each file is attached as a link.
      placeholder: "Drop the export, diagnostics or log file here..."
    validations:
      required: false

  - type: textarea
    id: debug_log
    attributes:
      label: Logs / Error Evidence
      description: >
        Paste the log lines around the problem: from WashData's Logs export, `Settings → System → Logs`, or a debug session (see the
        Evidence section above). Short excerpts only; attach a long log as a file above.
      placeholder: "Paste log lines here..."
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other context about the problem (screenshots, related automations, unusual HA setup, etc.)
    validations:
      required: false

  - type: checkboxes
    id: pr_intention
    attributes:
      label: Contributing a Fix
      description: >
        Want to fix this yourself? Please agree the work with the maintainer **before** you write any code.


        **How it works:**

        1. Tick the box below to flag that you intend to submit a PR.

        2. Wait for the maintainer to review and add the `accepted` label. This is where scope and approach are agreed - the fix may already be in progress, or need a different direction.

        3. Only after the `accepted` label is added should you open a PR referencing this issue.


        **Do not** open a PR now, alongside this issue. A PR opened in parallel with a not-yet-accepted issue skips the agree-first step: it is not reviewed and waits until the maintainer decides on the issue. Do not start significant work before the label is added either, so you never build something that cannot be merged.
      options:
        - label: I plan to submit a PR fixing this, and I understand I must wait for the `accepted` label before opening it (one opened now / in parallel is not reviewed until then)
          required: false
