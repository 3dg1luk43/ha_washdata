name: Checks

# Fast checks on every push: generated files match their sources (panel build,
# WS types), the panel parses and renders, docs_check (docs vs code), and the fast
# pytest suite. A pull request from a fork runs them too; a branch in this
# repository is already checked on push. The slow suite needs the private
# recordings and stays local (`devtools/verify.sh full`); the panel E2E and the
# real-HA box have their own workflows (e2e.yml, testbox.yml). Public repository:
# standard runners cost nothing, so the only budget is concurrency.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-artifacts:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: npm ci --prefix devtools
      - name: Minified panel/card artifacts match their sources
        run: node devtools/build_panel.mjs --check
      - name: Panel method map matches the panel (DOCS-09)
        run: node devtools/gen_panel_map.mjs --check
      - name: WS type artifacts match ws_schema.py
        run: python devtools/generate_ws_types.py --check
      - name: Docs match the code (anchors, constants, register ids, em dashes)
        run: python devtools/docs_check.py
      - name: Panel JS parses and renders
        run: |
          node --check custom_components/ha_washdata/www/ha-washdata-panel.js
          node --check custom_components/ha_washdata/www/ha-washdata-card.js
          node devtools/panel_smoke.js

  # The fast pytest suite (audit TESTING-02). It ran on pull requests only, so a
  # release branch pushed without one (0.6.2) was never tested in CI. Fast tier
  # only (no `slow`/`benchmark`), parallel, about two minutes with the install.
  pytest-fast:
    name: Fast pytest suite
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Fast suite
        run: python -m pytest tests -q -p no:cacheprovider -n auto
