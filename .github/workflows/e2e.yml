name: Panel E2E

# The Playwright suite (chromium + mobile-chrome) against the readable panel, and
# chromium against the minified build users download. Only when the panel, its
# translations or the specs change: everything else cannot change what it sees.
# A pull request from a fork runs it; a branch in this repository runs it on push
# (its pull request would only run the same commit twice).
#
# Public repository: standard runners cost nothing. About 10 min.

on:
  push:
    branches: ["**"]
    paths:
      - "custom_components/ha_washdata/www/**"
      - "custom_components/ha_washdata/translations/panel/**"
      - "custom_components/ha_washdata/frontend.py"
      - "custom_components/ha_washdata/ws_schema.py"
      - "playwright-tests/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "custom_components/ha_washdata/www/**"
      - "custom_components/ha_washdata/translations/panel/**"
      - "custom_components/ha_washdata/frontend.py"
      - "custom_components/ha_washdata/ws_schema.py"
      - "playwright-tests/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Panel E2E
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: playwright-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci && npx playwright install --with-deps chromium
      - name: Readable panel (chromium + mobile-chrome)
        run: npx playwright test --workers=4 --reporter=dot
      - name: Minified panel (chromium)
        env:
          PANEL_BUILD: min
        run: npx playwright test --project=chromium --workers=4 --reporter=dot
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-tests/playwright-report
          retention-days: 7
