[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# By default, skip slow tests and benchmarks for fast dev iteration.
# Use ./run_tests.sh --all (or --slow / --bench) to opt in.
# -rfEs keeps the default failure/error summary and adds every skip with its
# reason (audit TESTING-14; a bare -rs would drop the FAILED lines): cycle_data/ is
# gitignored, so off the maintainer's disk the replay tests skip, and conftest.py
# prints one line counting them.
addopts = -m "not slow and not benchmark" -rfEs

# Per-test limit (pytest-timeout, installed with pytest-homeassistant-custom-component;
# audit TESTING-18). Tests marked slow or benchmark get SLOW_TEST_TIMEOUT_S (1800 s)
# from tests/conftest.py instead, however they are invoked.
timeout = 60

markers =
    slow: long-running tests (real-data replays, stress simulations, end-to-end). Skipped by default.
    benchmark: performance characterization tests (no functional assertions). Skipped by default.

filterwarnings =

    ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning

